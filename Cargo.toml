[workspace]
members = [
    "crates/impossible-ocr-domain",
    "crates/impossible-ocr-protocol",
    "crates/impossible-ocr-pipeline",
    "crates/impossible-ocr-onnx",
    "crates/impossible-ocr-server",
]
exclude = ["vendor/impossible-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.6", features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
clap = { version = "=4.5.50", features = ["derive", "env"] }
fs2 = "=0.4.3"
futures-util = "=0.3.34"
http-body-util = "=0.1.3"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }
impossible-ocr-domain = { version = "=0.1.0", path = "crates/impossible-ocr-domain" }
impossible-ocr-onnx = { version = "=0.1.0", path = "crates/impossible-ocr-onnx" }
impossible-ocr-pipeline = { version = "=0.1.0", path = "crates/impossible-ocr-pipeline" }
impossible-ocr-protocol = { version = "=0.1.0", path = "crates/impossible-ocr-protocol" }
impossible-server-core = { version = "=0.1.0", path = "vendor/impossible-server/crates/impossible-server-core" }
impossible-server-testkit = { version = "=0.1.0", path = "vendor/impossible-server/crates/impossible-server-testkit" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"] }
prost = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
tokio = "=1.48.0"
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = { version = "=0.14.2", default-features = false, features = ["codegen"] }
tonic-build = { version = "=0.14.2", default-features = false }
tonic-prost = "=0.14.2"
tonic-prost-build = "=0.14.2"
tower = { version = "=0.5.2", features = ["util"] }
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
