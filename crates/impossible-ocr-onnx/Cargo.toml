[package]
name = "impossible-ocr-onnx"
description = "Offline ONNX model admission seam for Impossible OCR"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The runtime remains dynamically loaded and is never downloaded by Cargo or at startup.
onnx-runtime = ["dep:ort"]

[dependencies]
fs2.workspace = true
futures-util.workspace = true
impossible-ocr-domain.workspace = true
impossible-ocr-pipeline.workspace = true
impossible-server-core.workspace = true
ort = { workspace = true, optional = true }
prost.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
axum.workspace = true
impossible-server-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
