[package]
name = "impossible-ocr-server"
description = "Local-first bounded server shell for Impossible OCR"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
onnx-runtime = ["impossible-ocr-onnx/onnx-runtime"]

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
impossible-ocr-domain.workspace = true
impossible-ocr-onnx.workspace = true
impossible-ocr-pipeline.workspace = true
impossible-ocr-protocol.workspace = true
impossible-server-core.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }

[dev-dependencies]
http-body-util.workspace = true
impossible-server-testkit.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
