openapi: 3.1.0
info:
  title: Impossible OCR
  version: 0.1.0
  description: Synchronous, loopback-only PNG/JPEG OCR. PDF, jobs, multipart, and WebSockets are not supported.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/ocr:
    post:
      summary: Recognize one base64-encoded raster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcrRequest' }
      responses:
        '200': { description: Canonical single-page OCR result }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/ocr:raw:
    post:
      summary: Recognize one raw raster
      parameters:
        - { in: header, name: x-image-format, required: true, schema: { enum: [png, jpeg] } }
        - { in: header, name: x-image-width, required: true, schema: { type: integer, minimum: 1, maximum: 16384 } }
        - { in: header, name: x-image-height, required: true, schema: { type: integer, minimum: 1, maximum: 16384 } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, contentEncoding: binary } }
          image/jpeg: { schema: { type: string, contentEncoding: binary } }
      responses:
        '200': { description: Canonical single-page OCR result }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/ocr:batch:
    post:
      summary: Recognize one all-or-nothing batch of at most eight rasters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/OcrRequest' } }
              additionalProperties: false
      responses:
        '200': { description: Canonical OCR results in input order }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/capabilities:
    get: { responses: { '200': { description: Stable product capabilities } } }
  /v1/models:
    get: { responses: { '200': { description: Aggregate model readiness without private paths } } }
  /v1/status:
    get: { responses: { '200': { description: Aggregate liveness and readiness } } }
  /health/live:
    get: { responses: { '200': { description: Process is live }, '503': { description: Process stopped } } }
  /health/ready:
    get: { responses: { '200': { description: Backend ready }, '503': { description: Backend unavailable } } }
  /metrics:
    get: { responses: { '200': { description: Bounded-cardinality Prometheus metrics } } }
  /mcp:
    post:
      summary: MCP JSON-RPC over Streamable HTTP
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { '200': { description: MCP JSON-RPC response } }
components:
  schemas:
    OcrRequest:
      type: object
      required: [image_base64, metadata]
      properties:
        image_base64: { type: string, contentEncoding: base64 }
        metadata:
          type: object
          required: [format, encoded_bytes, width, height]
          properties:
            format: { enum: [png, jpeg] }
            encoded_bytes: { type: integer, minimum: 1, maximum: 33554432 }
            width: { type: integer, minimum: 1, maximum: 16384 }
            height: { type: integer, minimum: 1, maximum: 16384 }
          additionalProperties: false
        options:
          type: object
          properties:
            language: { const: english }
            include_words: { type: boolean }
            minimum_confidence: { type: number, minimum: 0, maximum: 1 }
          additionalProperties: false
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        request_id: { type: integer, minimum: 0 }
        error:
          type: object
          required: [code, message]
          properties:
            code: { enum: [invalid_request, invalid_image, model_unavailable, overloaded, cancelled, deadline_exceeded, internal] }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
  responses:
    Error:
      description: Stable privacy-safe error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
